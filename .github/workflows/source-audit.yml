name: Client source audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check client inventory and privacy
        run: python3 tools/check-publication.py --history
      - name: Install verified Gitleaks
        shell: bash
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan files and all reachable history
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --config .gitleaks.toml --redact --no-banner
